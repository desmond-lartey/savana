site_name: savana
site_description: A geospatial intelligence ecosystem -- adaptive land-system classification and precipitation product assessment for savanna landscapes
site_author: Desmond Lartey
repo_url: https://github.com/desmond-lartey/savana

copyright: "Copyright &copy; 2026 Desmond Lartey"

theme:
    name: material
    logo: assets/logo.png
    favicon: assets/favicon.ico
    palette:
        - scheme: slate
          primary: green
          accent: green
          toggle:
              icon: material/toggle-switch
              name: Switch to light mode
        - scheme: default
          toggle:
              icon: material/toggle-switch-off-outline
              name: Switch to dark mode
    icon:
        repo: fontawesome/brands/github
    features:
        - navigation.instant
        - navigation.tracking
        - navigation.top
        - search.highlight
        - search.share

plugins:
    - search
    - mkdocstrings
    - include-markdown

nav:
    - Home: index.md
    - Installation: installation.md
    - Quick Start: quickstart.md
    - Method Overview: method.md
    - Classification API Reference: api_classification.md
    - Rainfall API Reference: api_rainfall.md
    - Contributing: contributing.md
    - Changelog: changelog.md

markdown_extensions:
    - admonition
    - pymdownx.details
    - pymdownx.superfences
    - pymdownx.highlight
    - toc:
          permalink: true

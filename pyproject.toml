[project]
name = "savana"
version = "0.1.2"
description = "Adaptive classification of complex savanna landscapes into management-relevant land-system classes"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["savanna", "remote-sensing", "earth-engine", "land-cover", "geospatial", "ecology", "classification"]
license = {text = "MIT License"}
authors = [
  {name = "Desmond Lartey"},
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "earthengine-api>=0.1.400",
    "geemap>=0.32",
    "pandas>=2.0",
]

[project.optional-dependencies]
vector = ["geopandas>=0.14"]
geolibre = ["geolibre>=1.0"]
agent = ["GeoAgent"]
dev = ["pytest>=7.0", "black", "flake8", "isort", "pre-commit", "bump-my-version"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[tool.setuptools.packages.find]
include = ["savana*"]
exclude = ["docs*", "tests*"]

[tool.bumpversion]
current_version = "0.1.2"
commit = true
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "savana/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

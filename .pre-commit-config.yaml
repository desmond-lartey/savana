repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-toml
          - id: check-yaml
          - id: check-merge-conflict
          - id: check-added-large-files
            args: ["--maxkb=500"]
          - id: end-of-file-fixer
            types: [python]
          - id: trailing-whitespace
          - id: requirements-txt-fixer
          - id: debug-statements

    - repo: https://github.com/psf/black-pre-commit-mirror
      rev: 26.5.1
      hooks:
          - id: black

    - repo: https://github.com/pycqa/isort
      rev: 9.0.0b1
      hooks:
          - id: isort
            args: ["--profile", "black"]

    - repo: https://github.com/pycqa/flake8
      rev: 7.3.0
      hooks:
          - id: flake8
            args: ["--max-line-length=100", "--extend-ignore=E203,W503"]

    - repo: https://github.com/codespell-project/codespell
      rev: v2.4.2
      hooks:
          - id: codespell
            args:
                [
                    "--skip=*.csv,*.geojson,*.json,*.yml,*.js,*.html,*.pdf",
                    "--ignore-words-list=classifers",
                ]

    - repo: local
      hooks:
          - id: check-version-sync
            name: Check pyproject.toml / __init__.py version match
            entry: python scripts/check_version_sync.py
            language: system
            pass_filenames: false
            files: ^(pyproject\.toml|savana/__init__\.py)$
